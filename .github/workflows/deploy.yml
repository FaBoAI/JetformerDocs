name: deploy
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fonts for PDF (Japanese)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk libpango-1.0-0 libpangoft2-1.0-0
      # weasyprint 63+ has a pagination bug that truncates this document after a few
      # articles (and can hang); 62.3 renders all pages correctly.
      - run: pip install mkdocs-material mkdocs-macros-plugin mkdocs-with-pdf "weasyprint==62.3" "pydyf==0.10.0"
      - run: mkdocs gh-deploy --force
        env:
          ENABLE_PDF_EXPORT: 1
